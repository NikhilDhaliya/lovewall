# One-command self-host: app + Postgres + RustFS (S3-compatible file storage, Apache-2.0).
#   cp .env.example .env   # fill in BETTER_AUTH_SECRET, CRON_SECRET, POSTGRES_PASSWORD, S3_ACCESS_KEY_ID and
#                          # S3_SECRET_ACCESS_KEY (.env.example says how to generate each)
#   docker compose up -d   # then open http://localhost:3000
# Compose refuses to start while a required secret is missing; there are no default passwords.
services:
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lovewall:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}@db:5432/lovewall
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-lovewall}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env (openssl rand -hex 12)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (openssl rand -hex 32)}
      S3_FORCE_PATH_STYLE: "true"
      # Behind a reverse proxy (Caddy or nginx in front of port 3000), set TRUST_PROXY=1 in .env: the proxy must append
      # the visitor's address to X-Forwarded-For, or overwrite the header named in TRUST_PROXY_HEADER.
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lovewall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: lovewall
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovewall"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env (openssl rand -hex 12)}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env (openssl rand -hex 32)}
      RUSTFS_VOLUMES: /data
    # Browsers upload straight to storage with signed URLs. Published on this machine only by default; on a server,
    # put it behind your reverse proxy with TLS (and set S3_PUBLIC_ENDPOINT), or set STORAGE_BIND=0.0.0.0.
    ports:
      - "${STORAGE_BIND:-127.0.0.1}:${STORAGE_PORT:-9000}:9000"
    volumes:
      - files:/data
    restart: unless-stopped

volumes:
  db:
  files:
