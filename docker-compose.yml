# One-command self-host: app + Postgres + RustFS (S3-compatible file storage, Apache-2.0).
#   cp .env.example .env   # set BETTER_AUTH_SECRET (openssl rand -base64 32)
#   docker compose up -d   # then open http://localhost:3000
services:
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://lovewall:lovewall@db:5432/lovewall
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-lovewall}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lovewall}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-lovewall-secret}
      S3_FORCE_PATH_STYLE: "true"
      # Only behind a reverse proxy that sets X-Real-IP (e.g. Caddy or nginx in front of port 3000):
      # TRUST_PROXY: "1"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lovewall
      POSTGRES_PASSWORD: lovewall
      POSTGRES_DB: lovewall
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovewall"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-lovewall}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-lovewall-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "${STORAGE_PORT:-9000}:9000"
    volumes:
      - files:/data
    restart: unless-stopped

volumes:
  db:
  files:
