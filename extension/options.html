<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Save to Lovewall settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main class="page">
      <header class="head">
        <svg class="mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8.5" />
          <path
            transform="translate(4 4.4)"
            d="M12 20.4c-.3 0-.6-.1-.8-.3C6.3 16 3.2 13.1 3.2 9.4 3.2 6.6 5.3 4.5 8 4.5c1.6 0 3 .7 4 2 1-1.3 2.4-2 4-2 2.7 0 4.8 2.1 4.8 4.9 0 3.7-3.1 6.6-8 10.7-.2.2-.5.3-.8.3z"
          />
        </svg>
        <h1>Save to Lovewall</h1>
      </header>

      <form id="form" class="card" novalidate>
        <div class="field">
          <label for="app-url">App URL</label>
          <input
            class="input"
            id="app-url"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://lovewall.tech"
          />
        </div>
        <div class="field">
          <div class="label-row">
            <label for="api-key">API key</label>
            <a id="get-key" target="_blank" rel="noreferrer">Get a key</a>
          </div>
          <input class="input" id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="lw_…" />
        </div>
        <div class="row">
          <button type="submit" class="button primary" id="save">Save</button>
          <p class="status" id="status" aria-live="polite"></p>
        </div>
      </form>

      <div class="foot">
        <p class="muted">The key stays in this browser.</p>
        <button type="button" class="button plain" id="disconnect" hidden>Disconnect</button>
      </div>
    </main>

    <script src="api.js"></script>
    <script src="options.js"></script>
  </body>
</html>
